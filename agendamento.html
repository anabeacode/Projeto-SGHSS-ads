<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Agendar Consulta</title>
</head>

<body>

    <header class="cabeçalho">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                
                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center " href="#">
                    <img src="imagens/heart-pulse.svg" alt="Logo" class="logo">
                    <span class="ms-2">Instituição VidaPlus</span>
                </a>

                <!-- BOTÃO DE NAVEGAÇÃO -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>

                <!-- LINKS -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto text-end">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="agendamento.html">Agendar Consulta</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="consulta.html">Consultas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="prontuario.html">Prontuário</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
           
    </header>

    <section class="container">
        <form id="form-agendamento" class="agendamento-form">
            <h2>Agendar Consulta</h2>

            <div class="campo">
                <label for="paciente">Nome do Paciente:</label>
                <input type="text" id="paciente" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo" >
                <label for="medico">Especialidade médica:</label>
                <select id="medico" required>
                <option value="">Selecione</option>
                <option value="clinica-geral">Clínica Geral</option>
                <option value="pediatria">Pediatria</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="ginecologia">Ginecologia</option>
                </select>
            </div>

            <div class="campo">
                <label for="data">Data:</label>
                <input type="date" id="data" required>
            </div>

            <div class="campo">
                <label for="hora">Hora:</label>
                <input type="time" id="hora" required min="8:00" max="18:00">
            </div>

            <button class="agendar" type="submit">Agendar</button>
            <p id="mensagem-agendamento"></p>
        </form>

       

 
    </section>
    

    <footer></footer>
<script src="js/agendamento.js" ></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
