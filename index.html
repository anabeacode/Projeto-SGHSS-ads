<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>SGHSS </title>
</head>
<body>

    <header class="cabeçalho">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                
                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center " href="#">
                    <img src="imagens/heart-pulse.svg" alt="Logo" class="logo">
                    <span class="ms-2">Instituição VidaPlus</span>
                </a>

                <!-- BOTÃO DE NAVEGAÇÃO -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>

                <!-- LINKS -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto text-end">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="agendamento.html">Agendar Consulta</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="consulta.html">Consultas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="prontuario.html">Prontuário</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
           
    </header>
   

   <section class="container">
        <form id="login-form">
            <h1>Login</h1>
            <div class="input-box">
                <input placeholder="Digite seu email" type="email" id="email">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password" id="senha">
                <i class="bx bxs-lock"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar minha senha
                </label>
                <a href="#">Esqueci senha</a>
            </div>

            <button type="submit" class="login" id="mensagem">Login</button>

            <div class="register-link">
                <p>Não tem uma conta?<a href="#">Cadastre-se</a></p>
            </div>
            

        </form>

    </section>
    
    <footer></footer>

<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
